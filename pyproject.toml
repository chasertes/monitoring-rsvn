[build-system]
requires = [
    "setuptools>=75,<81",
    "wheel>=0.45,<1",
]
build-backend = "setuptools.build_meta"


[project]
name = "monitoring-rsvn"
version = "0.1.0"
description = "SNMP and RTSP/WINK monitoring system"
readme = "README.md"
requires-python = ">=3.11,<3.15"

authors = [
    { name = "Chaser" },
]

dependencies = [
    "fastapi>=0.142,<0.143",
    "uvicorn[standard]>=0.35,<1",

    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",

    "sqlalchemy>=2.1,<2.2",
    "asyncpg>=0.30,<1",
    "alembic>=1.20,<1.21",

    "pysnmp>=7.1.30,<8",

    "openpyxl>=3.1,<4",
    "jinja2>=3.1,<4",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "httpx>=0.28,<1",
    "ruff>=0.13,<1",
]


[project.scripts]
monitoring-rsvn-web = "app.main:main"
monitoring-rsvn-worker = "app.worker:main"


[tool.setuptools.packages.find]
include = [
    "app",
    "app.*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

asyncio_mode = "auto"


[tool.ruff]
line-length = 88
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

ignore = [
    "E501",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.alembic]
script_location = "migrations"
prepend_sys_path = [
    ".",
]